services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dbdata:/var/lib/postgresql/data
      - ./initdata/banvic.sql:/docker-entrypoint-initdb.d/banvic.sql
    ports:
      - 55432:5432
